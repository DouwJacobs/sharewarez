# Application Docker Compose configuration
#
# Setup Instructions:
# 1. Copy .env.docker.example to .env and customize your settings
# 2. Run: docker compose pull && docker compose up -d
#
# Volume Mounts:
# - DATA_FOLDER_WAREZ: Your games directory, mounted read-only to /storage
# - LIBRARY_HOST_PATH: Persistent storage for cover images, themes, and zips (default: ./data/library)

services:
  app:
    image: ${GAME_LIBRARY_IMAGE:-douwjacobs/gamelibrary:latest}
    container_name: gamelibrary-app
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATA_FOLDER_WAREZ=/storage
      - UPLOAD_FOLDER=/app/sharewarez/static/library
      - SECRET_KEY=${SECRET_KEY}
      - DEV_MODE=${DEV_MODE:-false}
      - WEB_WORKERS=${WEB_WORKERS:-2}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-2}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-1800}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "${DATA_FOLDER_WAREZ}:/storage:ro"
      - "${LIBRARY_HOST_PATH:-./data/library}:/app/sharewarez/static/library"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5006/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: ${GAME_LIBRARY_IMAGE:-douwjacobs/gamelibrary:latest}
    container_name: gamelibrary-worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATA_FOLDER_WAREZ=/storage
      - UPLOAD_FOLDER=/app/sharewarez/static/library
      - SECRET_KEY=${SECRET_KEY}
      - DEV_MODE=false
      - DB_POOL_SIZE=${DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-2}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-1800}
      - JOB_POLL_SECONDS=${JOB_POLL_SECONDS:-1}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "${DATA_FOLDER_WAREZ}:/storage:ro"
      - "${LIBRARY_HOST_PATH:-./data/library}:/app/sharewarez/static/library"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  db:
    image: postgres:17.6
    container_name: gamelibrary-db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
#    ports:
#      - "5432:5432"  # Optional: expose PostgreSQL port for external access

volumes:
  db_data:
    driver: local
