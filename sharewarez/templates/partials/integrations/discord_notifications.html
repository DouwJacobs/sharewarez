<div class="notification-settings-section mt-4">
    <h5><i class="fas fa-bell" aria-hidden="true"></i> Discord delivery</h5>
    <p class="text-muted">Choose automatic Discord events in <a href="{{ url_for('admin2.settings', section='notifications') }}">Notification rules</a>.</p>
    <form id="discordNotificationForm" class="mt-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="settings-check-row">
            <input type="checkbox" id="discordNotifyManualTrigger">
            <span><strong>Allow manual game notifications</strong><small>Show the manual Discord action on eligible games.</small></span>
        </label>
        <div class="mt-3"><button type="submit" class="btn btn-primary">Save manual-notification setting</button></div>
    </form>
</div>
