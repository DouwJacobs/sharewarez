<div id="deleteGameModal" class="modal delete-game-modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="deleteGameModalTitle" aria-hidden="true" data-focus-managed-dialog>
    <div class="modal-content">
        <button type="button" class="close-button" aria-label="Close" data-dialog-close>&times;</button>
        <h2 id="deleteGameModalTitle">Warning!</h2>
        <p>This action will DELETE THE GAME FROM DISK! This action cannot be undone.</p>
        <form action="/delete_full_game" method="post" id="deleteGameForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="game_uuid" id="deleteGameUuid">
            <button type="submit" class="delete-confirm btn btn-danger">Delete Game</button>
            <button type="button" class="delete-cancel btn btn-secondary">Cancel</button>
        </form>
    </div>
</div>
