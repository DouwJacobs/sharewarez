{% extends "base.html" %}
{% block styles %}
{{ super() }}
<link rel="stylesheet" href="{{ 'css/login/confirmation_success.css'|theme_asset }}">
{% endblock %}
{% block content %}
<div class="container-login">
    <div class="content-login">
        <img src="{{ url_for('static', filename=brand_logo_path) }}" alt="{{ site_title }} logo" class="login-logo">
        <h1 class="logo">Account Activated!</h1>
        <p>You're now ready to embark on your journey with us. Log in and set sail towards adventure!</p>
        <div class="container-buttons-login">
            <a href="{{ url_for('login.login') }}" class="btn btn-primary button-login">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
