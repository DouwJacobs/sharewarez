{% extends "base.html" %}
{% block content %}

<div class="container-login">
    <div class="content-login">
        <div class="container-base">
            <div class="container">
                <img src="{{ url_for('static', filename='newstyle/sharewarez_logo.png') }}" alt="ShareWareZ Logo" class="login-logo">
            </div>
        </div>
        
        <h2 style="text-align: center; margin-top: 5px;">Reset Password</h2>
        <p style="text-align: center; font-size: 14px; opacity: 0.8; margin-bottom: 20px;">
            Please enter your email address to receive a link to reset your password.
        </p>

        <div class="container-content">
            <form action="{{ url_for('login.reset_password_request') }}" method="post">
                {{ form.hidden_tag() }}
                
                <label for="email" class="label-large-text">Email</label><br>
                <input type="email" class="input-glass" id="email" name="email" placeholder="Enter your email" autocomplete="email"><br>
                
                <div class="container-buttons-login">
                    <input type="submit" value="Request Password Reset" class="btn btn-primary button-login">
                    <a href="/login" class="btn btn-primary button-login">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
