{% extends "base.html" %}
{% block content %}

<div class="container-login">
    <div class="content-login">
        <div class="container-base">
            <div class="container">
                <img src="{{ url_for('static', filename=brand_logo_path) }}" alt="{{ site_title }} logo" class="login-logo">
            </div>
        </div>
        
        <h2 style="text-align: center; margin-top: 5px;">Reset Password</h2>
        <p style="text-align: center; font-size: 14px; opacity: 0.8; margin-bottom: 20px;">
            Please enter your new password and confirm it.
        </p>

        <div class="container-content">
            <form action="{{ url_for('login.reset_password', token=token) }}" method="post">
                {{ form.csrf_token }}
                
                <label for="password" class="label-large-text">New Password</label><br>
                <input type="password" class="input-glass" id="password" name="password" placeholder="New Password" autocomplete="new-password"><br>
                
                <label for="confirm_password" class="label-large-text">Confirm Password</label><br>
                <input type="password" class="input-glass" id="confirm_password" name="confirm_password" placeholder="Confirm Password" autocomplete="new-password"><br>
                
                <div class="container-buttons-login">
                    <input type="submit" value="Reset Password" class="btn btn-primary button-login">
                    <a href="/login" class="btn btn-primary button-login">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
