{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ 'css/setup/setup.css'|theme_asset }}">

<div class="container-login">
    <div class="content-login">
        <img src="{{ url_for('static', filename='newstyle/sharewarez_logo.png') }}" alt="ShareWareZ Logo" class="login-logo">
        
        <h2>SharewareZ SMTP Setup</h2>
        <p class="setup-info">Configure your email settings to enable user registration and password reset functionality.</p>

        <div class="container-content">
            <form method="POST" action="{{ url_for('setup.setup_smtp') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label class="label-large-text">Enable SMTP</label><br>
                <input type="checkbox" name="smtp_enabled" value="true" checked class="form-check-input"><br>

                <label for="smtp_server" class="label-large-text">SMTP Server</label><br>
                <input type="text" id="smtp_server" name="smtp_server" class="input-glass" autocomplete="url"><br>

                <label for="smtp_port" class="label-large-text">SMTP Port</label><br>
                <input type="number" id="smtp_port" name="smtp_port" value="587" class="input-glass"><br>

                <label for="smtp_username" class="label-large-text">SMTP Username</label><br>
                <input type="text" id="smtp_username" name="smtp_username" class="input-glass" autocomplete="email"><br>

                <label for="smtp_password" class="label-large-text">SMTP Password</label><br>
                <input type="password" id="smtp_password" name="smtp_password" class="input-glass" autocomplete="off"><br>

                <label class="label-large-text">Use TLS</label><br>
                <input type="checkbox" name="smtp_use_tls" value="true" checked class="form-check-input"><br>

                <label for="smtp_default_sender" class="label-large-text">Default Sender Email</label><br>
                <input type="email" id="smtp_default_sender" name="smtp_default_sender" class="input-glass" autocomplete="email"><br>

                <div class="container-buttons-login">
                    <button type="submit" class="btn btn-primary button-login">Next Step</button>
                    <button type="submit" name="skip_smtp" value="1" class="btn btn-secondary button-login">Skip SMTP Setup</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
