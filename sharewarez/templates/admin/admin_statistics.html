{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ 'css/admin/admin_statistics.css'|theme_asset }}">

<main class="statistics-page">
    <section class="statistics-panel">
        <header class="statistics-header">
            <div>
                <p class="statistics-eyebrow">Reporting</p>
                <h1>{{ site_title }} Statistics</h1>
                <p>Download activity, collection engagement, and invitation trends.</p>
            </div>
        </header>

        <p id="statisticsStatus" class="statistics-status" role="status" aria-live="polite">Loading statistics…</p>

        <div class="statistics-grid" aria-busy="true">
            <article class="statistics-chart-card"><canvas id="downloadsPerUserChart"></canvas></article>
            <article class="statistics-chart-card"><canvas id="topGamesChart"></canvas></article>
            <article class="statistics-chart-card"><canvas id="downloadTrendsChart"></canvas></article>
            <article class="statistics-chart-card"><canvas id="inviteTokensChart"></canvas></article>
            <article class="statistics-chart-card"><canvas id="topDownloadersChart"></canvas></article>
            <article class="statistics-chart-card"><canvas id="topCollectorsChart"></canvas></article>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='library/themes/default/js/chart-utils.js') }}"></script>
<script src="{{ url_for('static', filename='library/themes/default/js/admin-statistics.js') }}"></script>

{% endblock %}
