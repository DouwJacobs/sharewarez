[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["sharewarez/static", "sharewarez/setup", "migrations/versions"]

[tool.ruff.lint]
# Begin with correctness failures that are safe to enforce across the legacy
# codebase. Broader style rules can be enabled module-by-module.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "sharewarez.models"
follow_imports = "skip"
